name: trufi_core_maps
description: A Flutter package for declarative map rendering backed by MapLibre GL (online and offline).
version: 1.0.0
homepage: https://github.com/trufi-association/trufi-core
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.3
  latlong2: ^0.9.1
  # 0.26.2 minimum: 0.26.1 still crashes on iOS with SIGABRT
  # (std::domain_error from mbgl::LatLng) when a camera op reaches a map
  # whose native frame is zero-sized — a route-detail screen fitting the
  # camera right after creating its map hits it. Fixed upstream in 0.26.2
  # (maplibre/flutter-maplibre-gl#819, PR #841); crashed a real-device
  # App Review submission on 0.25.0 (Trujillo, 2026-08-09).
  maplibre_gl: ^0.26.2
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  vector_tile: ^4.0.0
  trufi_core_interfaces: ^1.0.0
  trufi_core_utils: ^1.0.0

dev_dependencies:
  # used by the choose-on-map widget test to provide MapEngineManager
  provider: ^6.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
